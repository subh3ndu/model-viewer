<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Media Gallery</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }

      body {
        background-color: #111;
        color: #fff;
        padding: 10px;
        overflow-x: hidden;
      }

      header {
        text-align: center;
        padding: 15px 0;
      }

      h1 {
        font-size: 1.8rem;
        color: #fff;
      }
      .play-icon {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        font-size: 3rem;
        color: white;
        opacity: 0.85;
        text-shadow: 0 0 10px rgba(0, 0, 0, 0.6);
        pointer-events: none;
      }

      .media-item.video img {
        filter: brightness(0.7);
        transition: filter 0.3s ease;
      }

      .media-item.video:hover img {
        filter: brightness(0.9);
      }

      .place-links {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 10px;
        margin: 20px 0;
      }

      .place-link {
        padding: 8px 16px;
        background-color: #333;
        border: none;
        border-radius: 20px;
        font-size: 0.9rem;
        color: #fff;
        cursor: pointer;
        transition: all 0.3s ease;
      }

      .place-link:hover,
      .place-link.active {
        background-color: #e74c3c;
      }

      .gallery {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
        gap: 15px;
      }

      .media-item {
        position: relative;
        border-radius: 8px;
        overflow: hidden;
        background-color: #222;
        aspect-ratio: 16 / 9;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
        cursor: pointer;
        transition: transform 0.3s ease;
      }

      .media-item:hover {
        transform: scale(1.02);
      }

      .media-item img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }

      /* Video placeholder style */
      .media-item.video {
        background: rgba(0, 0, 0, 0.6);
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
      }

      .media-item.video:hover::before {
        opacity: 1;
      }

      .fullscreen-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.98);
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 1000;
        padding: 10px;
      }

      .fullscreen-content {
        width: 100%;
        max-width: 95%;
        max-height: 95%;
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .fullscreen-content img,
      .fullscreen-content iframe {
        max-width: 100%;
        max-height: 100%;
        border-radius: 8px;
      }

      .youtube-player {
        width: 100%;
        height: 100%;
        min-height: 300px;
        border: none;
      }

      .close-btn {
        position: absolute;
        top: 15px;
        right: 15px;
        color: white;
        font-size: 2.5rem;
        background: rgba(0, 0, 0, 0.7);
        width: 50px;
        height: 50px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        z-index: 1001;
        border: none;
      }

      @media (max-width: 768px) {
        .gallery {
          grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
        }
        .place-link {
          padding: 6px 12px;
          font-size: 0.85rem;
        }
      }

      @media (max-width: 480px) {
        .gallery {
          grid-template-columns: 1fr;
        }
        h1 {
          font-size: 1.5rem;
        }
      }
    </style>
  </head>
  <body>
    <!-- <header>
      <h1>Travel Media</h1>
    </header> -->

    <div class="place-links" id="placeLinks"></div>
    <div class="gallery" id="gallery"></div>

    <div class="fullscreen-overlay" id="fullscreenOverlay">
      <button class="close-btn" id="closeBtn">×</button>
      <div class="fullscreen-content" id="fullscreenContent"></div>
    </div>

    <script>
      const mediaData = {
        places: [
          {
            name: "Similipal",
            media: [
              //   { type: "video", url: "https://youtube.com/embed/qHX-R4NZo8M" },
              { type: "video", url: "https://youtube.com/embed/ThhsG0gImec" },
              { type: "video", url: "https://youtube.com/embed/h99fPdOvvIw" },
              {
                type: "video",
                url: "https://youtube.com/embed/jNqQMaflIkc",
              },
            ],
          },
          {
            name: "Hirakud",
            media: [
              { type: "video", url: "https://youtube.com/embed/jNqQMaflIkc" },
              {
                type: "image",
                url: "https://images.unsplash.com/photo-1448375240586-882707db888b?auto=format&fit=crop&w=1350&q=80",
              },
            ],
          },
        ],
      };

      const gallery = document.getElementById("gallery");
      const placeLinks = document.getElementById("placeLinks");
      const fullscreenOverlay = document.getElementById("fullscreenOverlay");
      const fullscreenContent = document.getElementById("fullscreenContent");
      const closeBtn = document.getElementById("closeBtn");

      // ✅ Extracts video ID from all YouTube formats (watch, embed, shorts, share)
      function extractYouTubeId(url) {
        const match = url.match(
          /(?:youtu\.be\/|youtube\.com\/(?:embed\/|watch\?v=|shorts\/))([^&\n?#]+)/
        );
        return match ? match[1] : null;
      }

      function getUrlParameter(name) {
        const urlParams = new URLSearchParams(window.location.search);
        return urlParams.get(name);
      }

      function initGallery() {
        // createPlaceLinks();
        const placeParam = getUrlParameter("place");
        if (placeParam) displayMedia(placeParam);
        else displayMedia(mediaData.places[0].name);
      }

      //   function createPlaceLinks() {
      //     mediaData.places.forEach((place) => {
      //       const link = document.createElement("button");
      //       link.className = "place-link";
      //       link.textContent = place.name;
      //       link.addEventListener("click", () => {
      //         window.history.pushState(
      //           {},
      //           "",
      //           `?place=${encodeURIComponent(place.name)}`
      //         );
      //         displayMedia(place.name);
      //       });
      //       placeLinks.appendChild(link);
      //     });
      //   }

      function displayMedia(placeName) {
        gallery.innerHTML = "";
        document
          .querySelectorAll(".place-link")
          .forEach((l) => l.classList.remove("active"));
        const activeLink = Array.from(
          document.querySelectorAll(".place-link")
        ).find((l) => l.textContent === placeName);
        if (activeLink) activeLink.classList.add("active");

        const place = mediaData.places.find((p) => p.name === placeName);
        if (!place) return;

        place.media.forEach((item) => {
          const mediaItem = document.createElement("div");
          mediaItem.className = `media-item ${item.type}`;

          if (item.type === "image") {
            const img = document.createElement("img");
            img.src = item.url;
            img.loading = "lazy";
            img.addEventListener("click", () => openFullscreen(item));
            mediaItem.appendChild(img);
          } else if (item.type === "video") {
            const videoId = extractYouTubeId(item.url);
            if (videoId) {
              // ✅ Add thumbnail preview
              const thumbImg = document.createElement("img");
              thumbImg.src = `https://img.youtube.com/vi/${videoId}/hqdefault.jpg`;
              thumbImg.alt = "Video thumbnail";
              thumbImg.loading = "lazy";
              mediaItem.appendChild(thumbImg);

              // Play overlay icon
              const playIcon = document.createElement("div");
              playIcon.className = "play-icon";
              playIcon.textContent = "▶";
              mediaItem.appendChild(playIcon);
            }

            mediaItem.addEventListener("click", () => openFullscreen(item));
          }

          gallery.appendChild(mediaItem);
        });
      }

      function openFullscreen(item) {
        fullscreenContent.innerHTML = "";

        if (item.type === "image") {
          const img = document.createElement("img");
          img.src = item.url;
          fullscreenContent.appendChild(img);
        } else if (item.type === "video") {
          const videoId = extractYouTubeId(item.url);
          if (!videoId) return alert("Invalid YouTube link!");

          const iframe = document.createElement("iframe");
          iframe.className = "youtube-player";
          iframe.src = `https://www.youtube.com/embed/${videoId}?autoplay=1&playsinline=1&rel=0`;
          iframe.allow =
            "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share";
          iframe.allowFullscreen = true;
          fullscreenContent.appendChild(iframe);
        }

        fullscreenOverlay.style.display = "flex";
        document.body.style.overflow = "hidden";
      }

      function closeFullscreen() {
        fullscreenOverlay.style.display = "none";
        document.body.style.overflow = "auto";
        fullscreenContent.innerHTML = ""; // Stops playback
      }

      closeBtn.addEventListener("click", closeFullscreen);
      fullscreenOverlay.addEventListener("click", (e) => {
        if (e.target === fullscreenOverlay) closeFullscreen();
      });

      window.addEventListener("popstate", () => {
        const placeParam = getUrlParameter("place");
        displayMedia(placeParam || mediaData.places[0].name);
      });

      document.addEventListener("DOMContentLoaded", initGallery);
    </script>
  </body>
</html>
