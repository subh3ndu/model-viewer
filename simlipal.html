<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Eco Tourism: Simlipal National Park</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background-color: #f9f9f9;
        color: #333;
        padding: 16px;
        line-height: 1.6;
      }

      h1 {
        text-align: center;
        margin: 24px 0;
        color: #ff0000;
        font-size: 1.8rem;
      }

      .video-container {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
        gap: 20px;
        max-width: 1200px;
        margin: 0 auto;
      }

      .video-item {
        background: white;
        border-radius: 12px;
        overflow: hidden;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        transition: transform 0.2s ease;
      }

      .video-item:hover {
        transform: translateY(-5px);
      }

      .video-title {
        padding: 12px 16px;
        font-weight: 600;
        font-size: 1rem;
        background-color: #fafafa;
        border-bottom: 1px solid #eee;
      }

      .video-wrapper {
        position: relative;
        width: 100%;
        height: 0;
        padding-bottom: 56.25%; /* 16:9 Aspect Ratio */
      }

      iframe {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        border: none;
      }

      @media (max-width: 600px) {
        .video-container {
          grid-template-columns: 1fr;
        }

        h1 {
          font-size: 1.5rem;
        }
      }

      footer {
        text-align: center;
        margin-top: 40px;
        padding: 20px;
        color: #777;
        font-size: 0.9rem;
      }
    </style>
  </head>
  <body>
    <!-- <h1>🎥 My YouTube Videos & Shorts</h1> -->

    <div class="video-container" id="videoContainer">
      <!-- Videos will be inserted here by JavaScript -->
    </div>

    <!-- <footer>Made with ❤️ for mobile viewers</footer> -->

    <script>
      // Array of video objects — replace with your own YouTube video IDs and titles
      const videos = [
        {
          id: "ClTv1jkxRJ8",
          title: "Simlipal: The largest national park of Odisha",
        },
      ];

      const container = document.getElementById("videoContainer");

      videos.forEach((video) => {
        const videoItem = document.createElement("div");
        videoItem.className = "video-item";

        const titleDiv = document.createElement("div");
        // titleDiv.className = "video-title";
        // titleDiv.textContent = video.title;

        const wrapperDiv = document.createElement("div");
        wrapperDiv.className = "video-wrapper";

        const iframe = document.createElement("iframe");
        iframe.src = `https://www.youtube.com/embed/${video.id}?autoplay=0&rel=0&modestbranding=1`;
        iframe.allow =
          "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture";
        iframe.allowFullscreen = true;

        wrapperDiv.appendChild(iframe);
        videoItem.appendChild(titleDiv);
        videoItem.appendChild(wrapperDiv);
        container.appendChild(videoItem);
      });
    </script>
  </body>
</html>
